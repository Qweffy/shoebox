[project]
name = "shoebox"
version = "0.1.0"
description = "Privacy-first receipt digitizer — 100% on-device, benchmarked against frontier cloud vision"
readme = "README.md"
authors = [
    { name = "Qweffy", email = "66446353+Qweffy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "fastapi>=0.137.1",
    "huggingface-hub>=1.16.1",
    "jinja2>=3.1.6",
    "mlx-lm[train]>=0.31.3",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai>=2.43.0",
    "opencv-python-headless>=4.13.0.92",
    "paddleocr>=3.4.1",
    "paddlepaddle>=3.3.1",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
shoebox = "shoebox.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "paddleocr.*", "paddle.*", "cv2.*", "ollama", "ollama.*",
    "datasets", "datasets.*", "sklearn", "sklearn.*", "mlx_lm", "mlx_lm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires OCR model download / real inference"]
